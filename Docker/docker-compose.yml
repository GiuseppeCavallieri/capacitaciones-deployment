services:
  mongodb:
    image: mongo:4.4
    container_name: veterinaria_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js

  backend:
    build:
      context: ../Config/Backend
      dockerfile: Dockerfile
    container_name: veterinaria_backend
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb:27017
      - PORT=:8080
      - DBNAME=veterinaria_citiaps
    depends_on:
      - mongodb

  frontend:
    build:
      context: ../Config/Frontend
      dockerfile: Dockerfile
      args:
        - BACK_URL=http://localhost:8080
    container_name: veterinaria_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: veterinaria_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=veterinaria_citiaps
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ../Config/Backend
      dockerfile: Dockerfile
    container_name: veterinaria_backend
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_DSN=postgres://postgres:postgres@postgres:5432/veterinaria_citiaps?sslmode=disable
      - PORT=:8080
    depends_on:
      - postgres

  frontend:
    build:
      context: ../Config/Frontend
      dockerfile: Dockerfile
      args:
        - BACK_URL=http://localhost:8080
    container_name: veterinaria_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
